<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Outer Glow & Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Vortex Swirl Primary Gradient -->
    <linearGradient id="vortexPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Accent Dynamic Loop Gradient -->
    <linearGradient id="vortexAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="#4f46e5" opacity="0.3" filter="url(#ambientGlow)" />

  <!-- Main Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Subtly Textured Radial Light -->
  <circle cx="256" cy="180" r="220" fill="url(#vortexPrimary)" opacity="0.15" filter="url(#ambientGlow)" />

  <!-- Outer Dynamic Orbit Ring -->
  <path d="M110 256 C110 150, 200 96, 310 100 C390 103, 420 160, 400 220" stroke="url(#vortexAccent)" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <path d="M402 256 C402 362, 312 416, 202 412 C122 409, 92 352, 112 292" stroke="url(#vortexPrimary)" stroke-width="12" stroke-linecap="round" opacity="0.4" />

  <!-- Main Chat Vortex Bubble Shape -->
  <g filter="url(#logoGlow)">
    <!-- Base Chat Shield / Vortex Bubble -->
    <path d="M140 185 C140 135, 185 105, 256 105 C327 105, 372 135, 372 185 C372 245, 335 285, 275 305 L285 365 C286 371, 279 375, 274 371 L205 320 C155 305, 140 255, 140 185 Z" fill="url(#vortexPrimary)" />

    <!-- Overlapping Vortex Wave Accent -->
    <path d="M175 190 C175 150, 210 130, 260 130 C320 130, 350 160, 345 205 C340 250, 290 280, 240 270 L210 288 C206 290, 202 287, 203 283 L208 252 C185 238, 175 215, 175 190 Z" fill="url(#vortexAccent)" opacity="0.85" />

    <!-- Inner Core Swirl Curve -->
    <path d="M225 185 C235 160, 275 160, 295 185 C310 205, 285 235, 250 230 C225 227, 220 205, 235 195 C245 188, 265 192, 270 202" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <!-- Active Pulse Status Indicator Dot -->
    <circle cx="360" cy="145" r="18" fill="#06b6d4" stroke="#ffffff" stroke-width="4" />
    <circle cx="360" cy="145" r="28" stroke="#06b6d4" stroke-width="3" opacity="0.5" />
  </g>
</svg>
